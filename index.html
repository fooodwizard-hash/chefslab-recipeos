function scaleRecipe() {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[state.activeVersion];
  if (!v || !v.ingredients || !v.ingredients.length) {
    showToast("No ingredients to scale", "error"); return;
  }

  const modal = document.createElement("div");
  modal.id = "scale-modal";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center";
  modal.innerHTML = `
    <div style="background:#fff;border-radius:4px;padding:32px;width:400px;max-width:95vw">
      <div style="font-family:'Playfair Display',serif;font-size:22px;margin-bottom:6px">Scale Recipe</div>
      <p style="font-size:12px;color:#333;margin-bottom:24px;line-height:1.6">
        Current version: <strong>${VERSION_CFG[state.activeVersion].label}</strong> — <strong>${v.portions} portions</strong><br>
        Enter the new portion count and all ingredient quantities will recalculate automatically.
      </p>
      <div style="margin-bottom:16px">
        <span class="label">New Portion Count</span>
        <input type="number" id="scale-portions" value="${v.portions}" min="1" style="font-size:24px;font-family:'Playfair Display',serif;text-align:center;padding:12px">
      </div>
      <div id="scale-preview" style="background:#F5F0E8;border-radius:3px;padding:12px;margin-bottom:20px;max-height:200px;overflow-y:auto;font-size:11px;line-height:1.8">
        ${v.ingredients.slice(0,8).map(i => `<div style="display:flex;justify-content:space-between"><span>${i.name}</span><span style="font-family:monospace;font-weight:700;color:#C4501A">${i.quantity}${i.unit}</span></div>`).join("")}
        ${v.ingredients.length > 8 ? `<div style="color:#333;margin-top:4px">+ ${v.ingredients.length - 8} more ingredients</div>` : ""}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="applyScale(${v.portions})" style="flex:1;justify-content:center">Apply Scale</button>
        <button class="btn btn-default" onclick="document.getElementById('scale-modal').remove()">Cancel</button>
      </div>
    </div>`;

  document.body.appendChild(modal);

  // Live preview as user types
  document.getElementById("scale-portions").addEventListener("input", function() {
    const newPortions = Number(this.value);
    if (!newPortions || newPortions < 1) return;
    const factor = newPortions / v.portions;
    const preview = document.getElementById("scale-preview");
    preview.innerHTML = v.ingredients.slice(0,8).map(i => {
      const newQty = Math.round(i.quantity * factor * 10) / 10;
      const changed = newQty !== i.quantity;
      return `<div style="display:flex;justify-content:space-between">
        <span>${i.name}</span>
        <span style="font-family:monospace;font-weight:700;color:${changed?'#C4501A':'#333'}">${newQty}${i.unit}</span>
      </div>`;
    }).join("") + (v.ingredients.length > 8 ? `<div style="color:#333;margin-top:4px">+ ${v.ingredients.length - 8} more ingredients</div>` : "");
  });
}

function applyScale(originalPortions) {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[state.activeVersion];
  const newPortions = Number(document.getElementById("scale-portions").value);
  if (!newPortions || newPortions < 1) {
    showToast("Enter a valid portion count", "error"); return;
  }
  const factor = newPortions / originalPortions;

  const scaledIngredients = (v.ingredients || []).map(ing => ({
    ...ing,
    quantity: Math.round(ing.quantity * factor * 10) / 10
  }));

  updateVersionField("portions", newPortions);
  updateVersionField("ingredients", scaledIngredients);

  document.getElementById("scale-modal").remove();
  showToast(`Scaled to ${newPortions} portions (×${Math.round(factor*100)/100})`);
  render();
}

function showHelp() {
  if (document.getElementById("help-modal")) return;

  const guides = {"dashboard": {"title": "Dashboard Guide", "sections": [["AI Recipe Generation", ["Type a brief description of the recipe you want in the AI Co-Creation field and press Enter or click Generate.", "Be specific — include cuisine, key ingredients, cooking style, occasion, dietary requirements, or service context. Example: A Cape Malay braised lamb shoulder with samp, peri-peri butter and pickled red onion for a winter banquet menu.", "The AI creates a full recipe with ingredients in metric units, method, production schedule, plating notes and a DNA profile.", "AI recipes are marked with a red AI badge in the sidebar. They are for inspiration and refinement — they do not interact with the Ingredients Database and cannot be costed until promoted.", "To cost an AI recipe, open it in the editor and click the green Promote to Costed Recipe button."]], ["Write New Recipe", ["Creates a blank Costed Recipe marked with a green COSTED badge in the sidebar.", "This is where your actual master recipes live. Ingredients are linked to the Ingredients Database for dynamic costing.", "As you enter ingredients they are matched to the database automatically using fuzzy matching — so Portobello mushrooms will match Mushrooms (portobello) in the database.", "Costs update automatically whenever database prices are changed.", "Click the Costing tab in the editor to see the full cost breakdown, food cost percentage, ideal selling price, and margin per portion."]], ["Recipe Library and Search", ["All recipes appear as cards sorted alphabetically. AI recipes show a red AI badge, Costed recipes show a green COSTED badge.", "Search by flavour profile, dietary tag, cuisine type, or ingredient name.", "Click any card to open it in the editor.", "Recipes show allergen warnings and flavour tags at a glance."]], ["Dashboard Stats", ["Total Recipes — your full library count including both AI and Costed recipes.", "With DNA — recipes that have been AI-generated with a full flavour and nutrition profile.", "Ingredients — total items in your Ingredients Database.", "Allergen Scanned — recipes that have been checked for the 14 declarable allergens."]], ["Your API key", ["The key is written to three places at once: local storage, session storage and a long-lived cookie. Chrome clears these under different conditions, so if any one survives the app puts the other two back automatically.", "The app also asks Chrome to mark this site as persistent, which is a real browser permission granted on engagement. Bookmarking the site and returning to it regularly makes Chrome considerably more likely to grant it.", "Open the key window to see Storage health: which of the three stores currently holds your key, whether Chrome has granted persistence, and whether a previous visit was recorded. If it reports no record of a previous visit and you know you have used the app before, the browser cleared this site's storage — that is the cause, and it is a Chrome setting rather than anything in the app.", "In Chrome, check Settings, then Privacy and security, then Cookies. Clear cookies and site data when you close all windows must be off, and this site should not be listed under Sites that can never use cookies.", "If the key is missing when the app starts, the key window now opens straight away rather than letting you discover it at the first failed generation."]]]}, "editor": {"title": "Recipe Editor Guide", "sections": [["AI vs Costed Recipes", ["AI Recipes (red AI badge) are generated from the dashboard. They show a green Promote to Costed Recipe button at the top of the editor.", "Costed Recipes (green COSTED badge) are created via Write New Recipe or promoted from AI. They have two tabs — Recipe and Costing.", "Only Costed recipes interact with the Ingredients Database and can produce a costing card, purchasing list, or nutritional summary."]], ["Reviewing an AI recipe before you cost it", ["A newly generated recipe is a draft. Read it through and correct it before promoting — the AI can get quantities, cuts and preparation wrong.", "Everything in the Recipe tab is editable: ingredient names, quantities, units and prep notes are all live fields. Click any of them and type.", "The readiness strip under the AI badge tells you what still needs attention: missing quantities, non-metric units, and ingredients not yet in your database.", "It turns green when the recipe is clean and ready to cost.", "Fix units opens the unit converter. Open database takes you to the Ingredients Database.", "Preview opens the recipe as a clean formatted document so you can read it the way a chef would, rather than as a form. Back to Edit returns you to the editor.", "Only promote to costed once the recipe reads correctly — promoting is not permanent, but costing a wrong recipe wastes your time.", "The readiness strip names every ingredient it could not find, each with a button to add it, and tells you when you already stock something similar — so you can rename it in the recipe rather than create a duplicate.", "Matching is deliberately cautious. Onion powder will not be matched to a fresh onion, butter beans will not be matched to butter, and red wine vinegar will not be matched to red wine. A missed match is visible and you fix it; a wrong one would quietly put a false figure on your costing card."]], ["Promoting an AI Recipe to Costed", ["Click the green Promote to Costed Recipe button in the editor.", "The system first checks for non-metric units. If any are found it shows a conversion modal with what each ingredient will convert to — click Auto-convert to Metric then Promote to fix them all at once.", "The system then tries to match every ingredient name to the Ingredients Database using fuzzy matching.", "Matched ingredients are confirmed in green. Unmatched ingredients are listed by name in orange — each has an Add to DB button.", "Click Add to DB next to any unmatched ingredient to open the database form pre-filled with that name. After saving, the promote modal reopens with refreshed match counts.", "If all ingredients are now matched, the recipe promotes automatically. You can also promote with unmatched items and cost them later.", "Click the X, Cancel, or tap outside the modal to dismiss and return to your recipe."]], ["Flavour Audit", ["The Flavour Audit panel on the right scores the current version across all eight pillars and tells you in plain language what is missing.", "Scoring is by strength, not by weight — the strongest contributor sets the score, because two grams of chilli delivers more Spice than two hundred grams of potato delivers anything. Three or more ingredients contributing the same pillar earns a bonus, since several moderate sources read as one confident one.", "Each pillar lands in one of three states: present, thin, or absent. The radar shows gaps as hollow red points and the row list names which ingredients are carrying each pillar.", "The verdict explains what the gap will actually feel like to eat. No Sour in a rich dish means nothing cuts the richness; no Sensation means the texture is uniform and the palate will tire by the fourth mouthful.", "Suggested fixes come only from ingredients you actually stock. A filled chip with a number means that one ingredient closes that many gaps at once — worth taking, since one addition beats three.", "Click any suggestion to drop it straight into the recipe at zero quantity, then set the amount yourself.", "If ingredients are not in your database the audit says so and reports how many it could read. An audit of six out of eleven ingredients is not an audit.", "Treat it as a second opinion, not a verdict. It cannot taste the dish and it does not know your intent — a deliberately austere dish will show gaps and be correct as it stands.", "Balance this recipe with AI hands Claude a precise brief: which pillars are missing, and which ingredients from your own database would close them. It is told to make the smallest change that works and to keep the dish recognisably itself.", "It will refuse a gap if closing it would harm the dish, and say so. When it finishes it reports which gaps closed and which stayed open, checked against a fresh audit rather than taken on trust.", "Newly generated recipes are now built with the pillars in mind from the start, so there should be fewer gaps to close."]], ["Recipe Versions", ["Every recipe has a Master version — your base recipe at standard yield.", "From the Master you can generate Home Cook, Restaurant, Banqueting, and Food Truck versions by clicking the star button next to each version tab.", "Each version is independent and has its own costing — a 50-portion banqueting version costs differently to a 10-portion restaurant version.", "Use the Clone button in the topbar to duplicate an entire recipe as a starting point for a variation."]], ["Scaling Recipes", ["Click the Scale button in the topbar to scale ingredient quantities to a new portion count.", "A live preview shows new quantities before you apply. Scaling works on the current version only.", "After scaling, the costing tab automatically recalculates with the new quantities.", "Use the Check Units button next to the ingredient list to scan for non-metric units and auto-convert them.", "Check Units now converts kitchen shorthand as well: sprigs, bunches, cloves, pinches, handfuls, knobs, dashes, splashes, sticks, leaves and slices all convert to grams or millilitres using professional standards."]], ["AI Panel", ["Click the AI Panel button in the topbar to expand the right panel to full width — useful on smaller screens or when refining with AI.", "The AI panel contains the co-creation chat, DNA radar, nutrition per portion, allergen profile, and all export options.", "Click Recipe in the topbar to return to the recipe editor.", "Use the refinement chat to adjust the recipe with natural language: Make it spicier, Replace cream with coconut milk, Simplify for a junior chef."]], ["Yield Override — costing what you actually bought", ["The Yield % column in the Costing tab is editable. It starts at the database value but you can override it for this recipe only.", "Why this matters: the database stores Chicken Whole at 65% yield, which assumes you debone it for breast meat. If your recipe joints the bird and uses every piece, the yield for that recipe is 100%.", "Worked example: a 1.6kg chicken at 98.00. At the database 65% the recipe is charged 150.77. Set the override to 100% and it is charged 98.00 — exactly what you paid.", "Overridden cells are highlighted and show a reset arrow. Click the arrow to return that line to the database value.", "The override is stored on the recipe line, not the database, so other recipes are unaffected.", "Overridden lines are marked with an asterisk on the printed Costing Card."]], ["Costing Tab", ["Only available on Costed recipes. Click the orange Costing tab to open it.", "Shows Total Recipe Cost, Cost per Portion, and Ideal Selling Price at the top.", "Enter your Target Food Cost percentage and your Actual Menu Price. The system calculates Actual Food Cost percentage, Margin per Portion, and Total Margin.", "The ingredient table shows Recipe Qty, Purchase Cost, Pack Size, Yield percentage from the database, Yield Cost per 100, Recipe Cost, and percentage of Recipe.", "The percentage of Recipe column shows each ingredient as a percentage of total recipe cost — green under 25 percent, amber 25 to 40 percent, red over 40 percent. Use this to identify cost drivers.", "Costs reprice automatically whenever you update ingredient prices in the Ingredients Database.", "Unmatched ingredients show a NOT IN DB badge with an Add to DB button inline.", "The Recipe Cost column is editable. Type any figure straight over the calculated one and that line is costed by hand — the cell outlines in orange and a reset arrow appears to return to the calculated figure.", "Manual costs are marked on the printed Costing Card with a double dagger, so any ecipes by Category — prints the entire collection in a selected version format.", "Recipe Index — a single landscape page listing all recipes with cuisine, type, portions, cost per portion, menu price, food cost percentage, margin, and allergens.", "Clone — duplicates the current recipe as a starting point for a variation. Find it next to the Delete button in the topbar.", "The Magazine and Training Manual now carry a flavour pillar line, and the Recipe Index gains a Pillars column showing coverage out of eight — anything under five prints in orange so a one-dimensional dish stands out when you scan a whole menu."]], ["Preview before printing", ["Every export now opens in a preview window first. Nothing goes to the printer until you ask.", "Print / Save PDF sends the document to your printer dialogue, where you can also choose Save as PDF.", "New Tab opens the document in its own browser tab if you would rather work with it there.", "Back to Edit closes the preview so you can correct the recipe and preview again.", "Check quantities, yields and costs in the preview before committing anything to paper."]]]}, "pantry": {"title": "Ingredients Database Guide", "sections": [["The Ingredients Database", ["153 pre-loaded ingredients across 13 categories sorted alphabetically — Baking, Condiments, Dairy, Fish and Seafood, Fruit, Indigenous, Meat and Poultry, Nuts and Seeds, Oils and Fats, Spices and Herbs, Starches and Grains, Stock and Liquids, and Vegetables.", "Every ingredient stores nutritional data (calories, protein, carbs, fat per 100g), cost per pack, yield percentage, and allergen flags.", "This data powers allergen scanning, recipe costing, purchasing lists, and nutritional summaries.", "Click the Sync DB button to reload the database if you have made changes in another tab or session.", "Click any column header to sort the table by that field. Click again to reverse.", "Your database is saved in this browser, and the saved copy is what loads each time. That means an app update on its own will not add new built-in ingredients. The app now tops them up automatically on startup and tells you how many arrived. Restore defaults does the same on demand. Neither touches your prices, your yields or anything you added yourself."]], ["Yield Calculation", ["Purchase Quantity is the pack size you buy — for example anchovies 425g tin.", "Purchase Cost is what you pay for that pack, exclusive of VAT or Tax.", "Yield percentage accounts for trimming, draining, peeling, bones, and other waste. Default is 100 percent.", "Example: Anchovies 425g tin at 70.25, yield 80 percent. Yield Cost = (70.25 / 425) / 0.80 = 0.2065 per gram, or 20.65 per 100g. This is what the system uses for recipe costing.", "For ingredients sold by each — eggs, avocados, lemons — the yield cost is calculated per each unit after yield. A 1 each avocado at 18.00 with 75 percent yield = 24.00 per each.", "Ingredients entered in kg are automatically converted to per 100g for costing. 1kg at 380.00 = 38.00 per 100g.", "The yield stored here is the default for that ingredient. Individual recipes can override it in their Costing tab when the preparation differs — for example a whole chicken jointed rather than deboned."]], ["Flavour Pillars", ["Every ingredient carries a profile across eight pillars: Savoury, Sweet, Salty, Sour, Bitter, Sensation, Spice and Smell.", "The five basic tastes are joined by three inputs that are not tastes at all — Sensation is mouthfeel (crunch, chew, fat, astringency), Spice is trigeminal heat (chilli, pepper, mustard, ginger) registering on the nerve rather than the tongue, and Smell is the aroma read retro-nasally as you chew, which is where most of what we call flavour actually comes from.", "Each pillar is scored none, slight, moderate or dominant. Score by how the ingredient behaves in use, not by how much of it goes in — two grams of chilli delivers more Spice than two hundred grams of potato delivers anything.", "All 153 default ingredients arrive already profiled. Edit any of them, or profile your own, in the Flavour Pillars block of the ingredient form.", "The Pillars column shows each ingredient's profile as coloured marks, strongest first. Solid marks are dominant, faded ones slight.", "Filter by any single pillar to answer questions like which of my ingredients bring acidity, or use Not yet profiled to find gaps in your own additions.", "This is a development aid rather than a scientific instrument. Use it to catch a dish that has no acidity or no crunch — not as a substitute for tasting."]], ["Adding and Editing Ingredients", ["Click Add Ingredient to add a new item. All costs must be entered exclusive of VAT or Tax — a prominent warning appears on the form.", "Fill in the name, category, purchase quantity, unit (g, kg, ml, lt, each), purchase cost, and yield percentage.", "The live yield preview updates as you type so you can see the exact recipe costing price before saving.", "AI fill asks Claude for the nutrition, pillar profile, allergens and a sensible yield from the ingredient name. It writes them into the form for you to check — nothing is saved until you press save, and cost and pack size remain yours to enter because no model can know what your supplier charges.", "Tick all applicable allergens — these are used by the allergen scanner in the Recipe Editor.", "The category auto-detects from the ingredient name when adding from a recipe promotion.", "Click Edit on any row to update any field. All inputs select on focus so you can type immediately without backspacing.", "Custom ingredients are marked with a green CUSTOM badge."]], ["Deleting Ingredients", ["Click Delete on any row. A confirmation prompt appears before removal.", "Deleting an ingredient does not remove it from existing recipes — only from future allergen scans, costing, and autocomplete.", "Pre-loaded ingredients can be deleted if not relevant to your operation."]], ["Filtering and Searching", ["Use the search field to // ══════════════════════════════════════════════════════════════════════
// FLAVOUR AUDIT ENGINE
//
// Scores a recipe version across the eight pillars.
// Potency does not scale with weight, so we score by the strongest
// contributor rather than by proportion of the dish. Three or more
// ingredients contributing the same pillar earns a layering bonus,
// because several moderate sources read as one confident one.
// ══════════════════════════════════════════════════════════════════════

function calcPillarProfile(version) {
  const blank = {
    scores: emptyPillars(), peaks: emptyPillars(),
    contributors: {}, matched: 0, unmatched: [], total: 0, ready: false, fatty: false
  };
  if (!version || !(version.ingredients || []).length) return blank;

  const peaks = emptyPillars();
  const contributors = {};
  PILLAR_IDS.forEach(id => contributors[id] = []);

  let matched = 0;
  let fatty = false;
  const unmatched = [];

  (version.ingredients || []).forEach(ing => {
    const db = findInPantry(ing.name);
    if (!db) { unmatched.push(ing.name); return; }
    matched++;
    if ((db.cal || 0) > 0 && (db.fat || 0) >= 20) fatty = true;
    const p = getPillars(db);
    PILLAR_IDS.forEach(id => {
      const v = p[id];
      if (v > 0) {
        if (v > peaks[id]) peaks[id] = v;
        contributors[id].push({ name: db.name, level: v });
      }
    });
  });

  const scores = emptyPillars();
  PILLAR_IDS.forEach(id => {
    const layered = contributors[id].length >= 3 ? 1 : 0;
    scores[id] = Math.min(3, peaks[id] + (peaks[id] > 0 ? layered : 0));
    contributors[id].sort((a,b) => b.level - a.level);
  });

  return {
    scores, peaks, contributors, matched, unmatched, fatty,
    total: (version.ingredients || []).length,
    ready: matched > 0
  };
}

// absent | thin | present
function pillarState(score) {
  return score === 0 ? "absent" : score === 1 ? "thin" : "present";
}

// Ingredients in the user's own database that would close a given gap
function pillarSuggestions(pillarId, version, limit, otherGaps) {
  const used = new Set((version.ingredients || [])
    .map(i => { const d = findInPantry(i.name); return d ? d.name.toLowerCase() : null; })
    .filter(Boolean));

  const gaps = (otherGaps || []).filter(g => g !== pillarId);

  // Rank by strength in the pillar we need, then by how many other gaps the
  // same ingredient would close. One ingredient fixing two gaps beats two
  // ingredients fixing one each. Cost is deliberately not a factor — a per-ml
  // figure cannot be compared against a per-each one.
  return state.pantry
    .filter(p => getPillars(p)[pillarId] >= 2 && !used.has(p.name.toLowerCase()))
    .map(p => {
      const pr = getPillars(p);
      const bonus = gaps.reduce((n, g) => n + (pr[g] >= 2 ? 1 : 0), 0);
      return { item: p, rank: pr[pillarId] * 10 + bonus, bonus };
    })
    .sort((a,b) => b.rank - a.rank || a.item.name.localeCompare(b.item.name))
    .slice(0, limit || 6)
    .map(x => Object.assign({}, x.item, { _alsoFixes: x.bonus }));
}

// Plain-English reading of the profile
function pillarVerdict(prof) {
  const gaps = PILLAR_IDS.filter(id => prof.scores[id] === 0);
  const thin = PILLAR_IDS.filter(id => prof.scores[id] === 1);
  const strong = PILLAR_IDS.filter(id => prof.scores[id] === 3);
  const label = id => PILLARS.find(p => p.id === id).label;
  const list = arr => arr.map(label).join(", ");

  if (!prof.ready) {
    return { tone: "none", text: "No ingredients matched to your database yet, so this recipe cannot be audited." };
  }
  if (gaps.length === 0 && thin.length === 0) {
    return { tone: "good", text: "All eight pillars are covered. Nothing obvious is missing — taste it and trust your palate from here." };
  }
  if (gaps.length === 0) {
    return { tone: "ok", text: "All eight pillars are present, though " + list(thin) + " " + (thin.length === 1 ? "is" : "are") + " only lightly represented. Worth a taste to decide whether that is deliberate." };
  }

  // Characterise what the absence will feel like
  // Richness means fat, not texture — samp is chewy but not rich.
  // Read it from the nutritional data rather than inferring it from Sensation.
  const rich = !!prof.fatty;
  const feel = [];
  if (gaps.includes("sour")) feel.push(rich ? "nothing cuts the richness" : "without acidity it will read as flat");
  if (gaps.includes("sensation")) feel.push("the texture is uniform, so the palate will tire");
  if (gaps.includes("salty")) feel.push("the other flavours will not lift");
  if (gaps.includes("smell")) feel.push("most of what reads as flavour is missing");
  if (gaps.includes("savoury")) feel.push("it will taste thin rather than satisfying");
  if (gaps.includes("bitter")) feel.push("there is no edge against the sweetness");
  if (gaps.includes("spice")) feel.push("there is no warmth or pungency");
  if (gaps.includes("sweet")) feel.push("there is nothing to round off the acidity or salt");

  const dominant = strong.length && gaps.length >= 3
    ? " It leans heavily on " + list(strong) + "."
    : "";

  return {
    tone: gaps.length >= 3 ? "bad" : "warn",
    text: (gaps.length === 1 ? "One gap: no " : gaps.length + " gaps: no ") + list(gaps) + ". " +
          (feel.length ? feel.slice(0,2).join(", and ").replace(/^./, s => s.toUpperCase()) + "." : "") + dominant
  };
}

// COSTING ENGINE
// ══════════════════════════════════════════════════════════════════════

function getYieldCostPerUnit(ingName, yieldOverride) {
  const dbItem = findInPantry(ingName);
  if (!dbItem) return null;
  // If this recipe line overrides the database yield, use a shallow copy
  if (yieldOverride !== undefined && yieldOverride !== null && yieldOverride !== "") {
    return calcYieldCost({ ...dbItem, yield_pct: parseFloat(yieldOverride) || 100 });
  }
  return calcYieldCost(dbItem); // cost per g/ml/each
}

// Effective yield for a recipe line: override if set, else database value
function effectiveYield(ing) {
  if (ing && ing.yieldOverride !== undefined && ing.yieldOverride !== null && ing.yieldOverride !== "") {
    return parseFloat(ing.yieldOverride) || 100;
  }
  const dbItem = findInPantry(ing ? ing.name : "");
  return dbItem ? (dbItem.yield_pct || 100) : null;
}

function hasYieldOverride(ing) {
  return ing && ing.yieldOverride !== undefined && ing.yieldOverride !== null && ing.yieldOverride !== "";
}

// Weight, volume and count are not interchangeable. Multiplying 30 ml by a
// per-each price treats 30 ml as 30 lemons, so we refuse rather than guess.
function unitClass(u) {
  const x = (u || "").toLowerCase().trim();
  if (x === "g" || x === "kg") return "weight";
  if (x === "ml" || x === "lt" || x === "l") return "volume";
  if (x === "each") return "count";
  return "unknown";
}

function hasCostOverride(ing) {
  return ing && ing.costOverride !== undefined && ing.costOverride !== null && ing.costOverride !== "";
}

// Everything the costing table and the print outputs need for one line
function lineCost(ing) {
  const db = findInPantry(ing ? ing.name : "");
  const manual = hasCostOverride(ing) ? (parseFloat(ing.costOverride) || 0) : null;

  if (!db) {
    return { db: null, cost: manual, manual: manual !== null,
             status: manual !== null ? "manual" : "nodb", perUnit: null };
  }

  const effItem = { ...db, yield_pct: effectiveYield(ing) };
  const perUnit = calcYieldCost(effItem);

  if (manual !== null) {
    return { db, effItem, perUnit, cost: manual, manual: true, status: "manual" };
  }

  const rc = unitClass(ing.unit || "g");
  const pc = unitClass(db.purchaseUnit || "g");
  if (rc !== pc || rc === "unknown") {
    // e.g. recipe in ml, ingredient priced per each
    return { db, effItem, perUnit, cost: null, manual: false,
             status: "mismatch", recipeClass: rc, dbClass: pc };
  }

  return { db, effItem, perUnit, cost: perUnit * (ing.quantity || 0),
           manual: false, status: "ok" };
}

function calcIngredientCost(ingName, qty, yieldOverride) {
  const costPerUnit = getYieldCostPerUnit(ingName, yieldOverride);
  if (costPerUnit === null) return null;
  return costPerUnit * qty;
}

function calcVersionCost(version) {
  if (!version || !version.ingredients || !version.ingredients.length) return null;
  let total = 0;
  let unmatched = [];
  const mismatched = [];
  version.ingredients.forEach(ing => {
    const lc = lineCost(ing);
    if (lc.status === "nodb") { unmatched.push(ing.name); return; }
    if (lc.status === "mismatch") { mismatched.push(ing.name); return; }
    total += lc.cost || 0;
  });
  return { total: parseFloat(total.toFixed(2)), unmatched, mismatched };
}

  'pint': {factor: 568, to: 'ml'}, 'pints': {factor: 568, to: 'ml'},
  'litre': {factor: 1000, to: 'ml'}, 'litres': {factor: 1000, to: 'ml'}, 'liter': {factor: 1000, to: 'ml'},

  'lb': {factor: 453.6, to: 'g'}, 'lbs': {factor: 453.6, to: 'g'}, 'pound': {factor: 453.6, to: 'g'}, 'pounds': {factor: 453.6, to: 'g'},
  'kilogram': {factor: 1000, to: 'g'}, 'kilograms': {factor: 1000, to: 'g'},
  // Kitchen shorthand — approximate professional standards

  'bunch': {factor: 30, to: 'g'}, 'bunches': {factor: 30, to: 'g'},
  'clove': {factor: 5, to: 'g'}, 'cloves': {factor: 5, to: 'g'},
  'pinch': {factor: 1, to: 'g'}, 'pinches': {factor: 1, to: 'g'},

  'knob': {factor: 15, to: 'g'}, 'dash': {factor: 2, to: 'ml'}, 'splash': {factor: 15, to: 'ml'},

const VALID_METRIC_UNITS = ['g', 'kg', 'ml', 'lt', 'l', 'each'];

function detectNonMetricUnits(ingredients) {
  return ingredients.filter(ing => {
    const u = (ing.unit||'').toLowerCase().trim();
    return !VALID_METRIC_UNITS.includes(u) && u !== '';
  });
}

function convertToMetric(ing) {
  const u = (ing.unit||'').toLowerCase().trim();
  const conv = NON_METRIC_UNITS[u];
  if (conv) {
    const newQty = Math.round(ing.quantity * conv.factor * 10) / 10;
    return { ...ing, quantity: newQty, unit: conv.to };
  }
  return ing;
}

function autoConvertRecipeUnits(versionKey) {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[versionKey];
  if (!v) return;
  const converted = (v.ingredients||[]).map(convertToMetric);
  const versions = { ...r.versions, [versionKey]: { ...v, ingredients: converted } };
  updateRecipe(r.id, { versions });
  saveState();
  render();
  showToast('Units converted to metric');
}

function openAddIngForPromotion(name) {
  // Track source — promote modal, costing tab, or AI editor right panel
  const promoteModal = document.getElementById('promote-modal');
  if (promoteModal) {
    promoteModal.style.display = 'none';
    state._promotingSource = 'promote';
  } else if (state.activeTab === 'costing') {
    state._promotingSource = 'costing';
  } else {
    state._promotingSource = 'editor'; // from AI recipe right panel
  }
  state._promotingIngName = name;
  // Auto-detect category from name
  const nameLower = name.toLowerCase();
  let cat = 'Condiments'; // overridden by every branch below
  if (/beef|lamb|chicken|pork|fish|prawn|mussel|salmon|tuna|snoek|ostrich|springbok|duck|veal|venison|meat|poultry|anchov|calamari|hake|kingklip/.test(nameLower)) cat = 'Meat & Poultry';
  else if (/onion|garlic|tomato|mushroom|pepper|carrot|spinach|celery|leek|zucchini|brinjal|squash|butternut|fennel|herb|parsley|coriander|thyme|rosemary|basil|chilli|ginger|bay/.test(nameLower)) cat = 'Spices & Herbs';
  else if (/cream|butter|milk|cheese|yoghurt|egg|amasi/.test(nameLower)) cat = 'Dairy';
  else if (/rice|pap|samp|flour|pasta|noodle|couscous|bread|potato|lentil|quinoa|barley|polenta/.test(nameLower)) cat = 'Starches & Grains';
  else if (/oil|fat|lard/.test(nameLower)) cat = 'Oils & Fats';
  else if (/stock|wine|coconut milk|cream|broth|bouillon/.test(nameLower)) cat = 'Stock & Liquids';
  else if (/sauce|paste|mustard|soy|worcester|mayo|ketchup|chutney|honey|vinegar|capers/.test(nameLower)) cat = 'Condiments';
  else if (/sugar|flour|baking|cocoa|chocolate|yeast/.test(nameLower)) cat = 'Baking';
  else if (/noodle|pasta|spaghetti|tagliatelle|fettuccine|linguine|penne|rigatoni|lasagne/.test(nameLower)) cat = 'Starches & Grains';
  else if (/almond|cashew|walnut|pecan|pine nut|seed|peanut/.test(nameLower)) cat = 'Nuts & Seeds';
  else if (/lemon|lime|orange|mango|avocado|banana|apple|pear|berry|fruit/.test(nameLower)) cat = 'Fruit';
  showAddIngredient({name, category:cat, purchaseQty:1000, purchaseUnit:"g", purchaseCost:0, yield_pct:100, allergens:[], cal:0, prot:0, carb:0, fat:0});
}

function confirmPromote() {
  const r = getActiveRecipe(); if (!r) return;
  // Add costing object to all existing versions
  const versions = {};
  Object.entries(r.versions).forEach(([key, v]) => {
    if (!v) { versions[key] = null; return; }
    versions[key] = {
      ...v,
      costing: v.costing || {
        targetFoodCostPct: 32,
        actualSellingPrice: 0,
      }
    };
  });
  updateRecipe(r.id, { type: "costed", versions });
  state.activeTab = "costing";
  saveState();
  render();
}

  const unmatched = result ? result.unmatched : [];

  const actualSP = parseFloat(costing.actualSellingPrice) || 0;

function updateCostingField(field, value) {

}

function showUnitCheck() {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[state.activeVersion];
  if (!v || !v.ingredients || !v.ingredients.length) { showToast("No ingredients to check", "error"); return; }
  const nonMetric = detectNonMetricUnits(v.ingredients);
  if (!nonMetric.length) { showToast("All units are metric ✓", "success"); return; }

  const modal = document.createElement("div");
  modal.id = "unit-check-modal";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px";
  modal.addEventListener("click", e => { if(e.target===modal) modal.remove(); });
  modal.innerHTML = `
    <div style="background:#fff;border-radius:4px;width:500px;max-width:95vw">
      <div style="background:#111;color:#fff;padding:16px 20px;border-radius:4px 4px 0 0;display:flex;justify-content:space-between;align-items:center">
        <div style="font-family:'Playfair Display',serif;font-size:18px">Unit Check — ${VERSION_CFG[state.activeVersion].label}</div>
        <button onclick="document.getElementById('unit-check-modal').remove()" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px">&#215;</button>
      </div>
      <div style="padding:16px">
        <div style="font-size:11px;color:#333;margin-bottom:12px;font-weight:600">
          ${nonMetric.length} non-metric unit${nonMetric.length>1?'s':''} found. Auto-convert or edit manually in the recipe.
        </div>
        ${nonMetric.map(ing => {
          const conv = NON_METRIC_UNITS[(ing.unit||'').toLowerCase()];
          const converted = conv ? Math.round(ing.quantity * conv.factor * 10) / 10 : null;
          return `<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:7px 10px;background:#FFF8F5;border:1px solid #C4501A;border-radius:2px;margin-bottom:5px;font-size:11px">
            <div><strong>${escHtml(ing.name||'')}</strong> — <span style="color:#C4501A;font-family:monospace;font-weight:700">${ing.quantity} ${ing.unit}</span></div>
            <span style="color:#8B5E00;font-weight:700">→</span>
            <div>${conv ? `<span style="color:#2C7A4B;font-family:monospace;font-weight:700">${converted} ${conv.to}</span>` : `<span style="color:#C4501A;font-style:italic">Cannot auto-convert</span>`}</div>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="autoConvertRecipeUnits(state.activeVersion);document.getElementById('unit-check-modal').remove()">

          <button class="btn btn-default" onclick="document.getElementById('unit-check-modal').remove()">Close</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function manualTopUp() {
  const n = topUpDefaults();
  if (!n) { showToast("Your database already has all " + SA_PANTRY_DEFAULT.length + " built-in ingredients"); return; }
  render();
  setTimeout(renderDBTable, 100);
  showToast(n + " ingredient" + (n === 1 ? "" : "s") + " restored — nothing of yours was changed");
}

function syncFromStorage() {
  try {
    const saved = localStorage.getItem("ros_pantry");
    if (saved) {
      state.pantry = JSON.parse(saved);
      state.pantry.sort((a,b) => a.name.localeCompare(b.name));
    }
    const savedR = localStorage.getItem("ros_recipes");
    if (savedR) state.recipes = JSON.parse(savedR);
    showToast("Synced — " + state.pantry.length + " ingredients");
    // Re-render and refresh table
    render();
    // For pantry view, ensure DB table populates after DOM is ready
    if (state.activeView === "pantry") {
      setTimeout(renderDBTable, 100);
    }
  } catch(e) {
    showToast("Sync failed: " + e.message, "error");
  }
}

// Auto-sync when another tab saves data
window.addEventListener('storage', function(e) {
  if (e.key === 'ros_pantry' || e.key === 'ros_recipes') {
    syncFromStorage();
  }
});

function toggleRightPanel() {
  const panel = document.getElementById('right-panel');
  const btn = document.getElementById('right-panel-toggle');
  const workspace = document.getElementById('workspace');
  if (!panel) return;

  if (panel.classList.contains('expanded')) {
    // Collapse — restore normal layout
    panel.classList.remove('expanded');
    panel.style.cssText = '';
    // Restore center pane
    const center = workspace ? workspace.querySelector('.center-pane') : null;
    if (center) center.style.display = '';
    if (btn) { btn.innerHTML = '⇔ AI Panel'; btn.style.background = ''; btn.style.color = ''; }
  } else {
    // Expand right panel to full workspace
    panel.classList.add('expanded');
    panel.style.cssText = 'width:100% !important;border-left:none;border-top:none;max-height:none;flex:1';
    // Hide center pane
    const center = workspace ? workspace.querySelector('.center-pane') : null;
    if (center) center.style.display = 'none';
    if (btn) { btn.innerHTML = '⇥ Recipe'; btn.style.background = '#C4501A'; btn.style.color = '#fff'; }
  }
}

// Pre-flight readiness summary shown above an AI recipe
function renderPillarAudit(r) {
  const v = r.versions[state.activeVersion];
  if (!v || !(v.ingredients || []).length) return "";
  const prof = calcPillarProfile(v);
  const verdict = pillarVerdict(prof);

  const toneBg = { good:"#F0F7F0", ok:"#F7F5EE", warn:"#FFF8F0", bad:"#FFF0EB", none:"#F5F5F5" };
  const toneBd = { good:"#2C7A4B", ok:"#8B9F3C", warn:"#8B5E00", bad:"#C4501A", none:"#ccc" };
  const toneTx = { good:"#2C4A3E", ok:"#4A5320", warn:"#6B4400", bad:"#C4501A", none:"#666" };

  const rows = PILLARS.map(pl => {
    const sc = prof.scores[pl.id];
    const st = pillarState(sc);
    const contribs = prof.contributors[pl.id] || [];
    const top = contribs.slice(0, 3).map(x => escHtml(x.name)).join(", ");
    const more = contribs.length > 3 ? " +" + (contribs.length - 3) : "";
    return `<div style="display:grid;grid-template-columns:16px 74px 46px 1fr;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #f0ece6">
      <span style="color:${sc===0?'#B03030':pl.colour};font-size:11px;text-align:center">${pl.icon}</span>
      <span style="font-size:11px;font-weight:700;color:${sc===0?'#B03030':'#333'}">${pl.label}</span>
      <span style="display:flex;gap:2px">
        ${[1,2,3].map(n => `<span style="width:11px;height:6px;border-radius:1px;background:${sc>=n?pl.colour:'#e2ddd5'}"></span>`).join('')}
      </span>
      <span style="font-size:10px;color:${sc===0?'#B03030':'#777'};font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${contribs.map(x=>escHtml(x.name)).join(', ')}">
        ${sc === 0 ? "— missing" : top + more}
      </span>
    </div>`;
  }).join('');

  // Fixes for absent and thin pillars, drawn from the user's own database
  const needs = PILLAR_IDS.filter(id => prof.scores[id] <= 1);
  const fixes = needs.map(id => {
    const pl = PILLARS.find(p => p.id === id);
    const sug = pillarSuggestions(id, v, 5, needs);
    if (!sug.length) return "";
    return `<div style="margin-bottom:7px">
      <div style="font-size:10px;font-weight:800;color:${pl.colour};margin-bottom:3px">
        ${pl.icon} ${pl.label} ${prof.scores[id]===0 ? "— missing" : "— only slight"}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:3px">
        ${sug.map(s => `<button onclick="addSuggestedIngredient('${escHtml(s.name).replace(/'/g,"\\'")}')"
          title="Add ${escHtml(s.name)} to this recipe"
          style="background:${s._alsoFixes ? pl.colour : '#fff'};border:1px solid ${pl.colour};color:${s._alsoFixes ? '#fff' : pl.colour};font-size:10px;font-weight:700;
          padding:3px 7px;border-radius:2px;cursor:pointer">+ ${escHtml(s.name)}${s._alsoFixes ? ' ·' + (s._alsoFixes+1) : ''}</button>`).join('')}
      </div>
    </div>`;
  }).filter(Boolean).join('');

  return `
    <div class="section-divider">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
        <span class="label" style="margin-bottom:0">Flavour Audit</span>
        <span style="font-size:9px;color:#888;font-weight:700">${prof.matched}/${prof.total} matched</span>
      </div>

      <canvas id="pillar-canvas" width="190" height="190" style="display:block;margin:6px auto 4px"></canvas>

      ${PILLAR_IDS.some(id => prof.scores[id] <= 1) && prof.ready ? `
        <button class="btn btn-primary" onclick="aiBalanceRecipe()" ${state.aiLoading ? 'disabled' : ''}
          style="width:100%;justify-content:center;background:#6B4423;margin-bottom:8px">
          ${state.aiLoading ? 'Working…' : '⚖ Balance this recipe with AI'}
        </button>` : ''}

      <div style="background:${toneBg[verdict.tone]};border:1px solid ${toneBd[verdict.tone]};border-radius:3px;
        padding:8px 10px;font-size:11px;line-height:1.55;color:${toneTx[verdict.tone]};font-weight:600;margin-bottom:8px">
        ${escHtml(verdict.text)}
      </div>

      ${prof.unmatched.length ? `<div style="font-size:10px;color:#C4501A;font-weight:700;margin-bottom:8px">
        ⚠ Audit is partial — ${prof.unmatched.length} ingredient${prof.unmatched.length>1?'s are':' is'} not in your database and could not be read.
      </div>` : ''}

      <div style="margin-bottom:8px">${rows}</div>

      ${fixes ? `<div style="background:#FAF7F2;border:1px solid #D8CFC0;border-radius:3px;padding:9px 10px">
        <div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:#6B4423;margin-bottom:6px">
          From your database
        </div>
        ${fixes}
        <div style="font-size:9px;color:#8B7355;font-weight:600;margin-top:4px;line-height:1.4">
          Filled chips close more than one gap — the number shows how many.
        </div>
      </div>` : ''}
    </div>`;
}

// Drop a suggested ingredient straight into the recipe
function addSuggestedIngredient(name) {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[state.activeVersion]; if (!v) return;
  const db = findInPantry(name);
  const unit = db && db.purchaseUnit === "each" ? "each" : (db && (db.purchaseUnit === "ml" || db.purchaseUnit === "lt") ? "ml" : "g");
  const ings = [...(v.ingredients || []), { name: db ? db.name : name, quantity: 0, unit, note: "" }];

// NUTRITIONAL SUMMARY
// ══════════════════════════════════════════════════════════════════════
function calcNutrition(version) {
  if (!version || !version.ingredients) return null;
  let totalCal = 0, totalProt = 0, totalCarb = 0, totalFat = 0, matched = 0, unmatched = [];
  (version.ingredients || []).forEach(ing => {
    const dbItem = findInPantry(ing.name);
    if (!dbItem) { unmatched.push(ing.name); return; }
    // DB nutrition is per 100g/ml. Recipe qty is in base units.
    const unit = (ing.unit||'g').toLowerCase();
    let qty = ing.quantity;
    if (unit === 'kg') qty *= 1000;
    else if (unit === 'lt' || unit === 'l') qty *= 1000;
    else if (unit === 'each') {
      // For each items, use purchaseQty as approximate weight
      const packUnit = (dbItem.purchaseUnit||'g').toLowerCase();
      let packQty = dbItem.purchaseQty || 100;
      if (packUnit === 'kg') packQty *= 1000;
      qty = (packQty / (dbItem.purchaseQty||1)) * ing.quantity; // scale per each
    }
    const factor = qty / 100;
    totalCal  += (dbItem.cal  || 0) * factor;
    totalProt += (dbItem.prot || 0) * factor;
    totalCarb += (dbItem.carb || 0) * factor;
    totalFat  += (dbItem.fat  || 0) * factor;
    matched++;
  });
  return { totalCal, totalProt, totalCarb, totalFat, matched, unmatched };
}

function printNutritionSummary() {
  const r = getActiveRecipe(); if (!r) return;
  const v = r.versions[state.activeVersion];
  if (!v) { showToast("No version data", "error"); return; }
  const cfg = VERSION_CFG[state.activeVersion];
  const portions = v.portions || cfg.portions;
  const nut = calcNutrition(v);
  if (!nut) { showToast("No nutritional data available", "error"); return; }

  const perPortion = {
    cal:  nut.totalCal  / portions,
    prot: nut.totalProt / portions,
    carb: nut.totalCarb / portions,
    fat:  nut.totalFat  / portions,
  };

  // Macros as % of calories
  const calFromProt = perPortion.prot * 4;
  const calFromCarb = perPortion.carb * 4;
  const calFromFat  = perPortion.fat  * 9;
  const totalMacroCal = calFromProt + calFromCarb + calFromFat || 1;

  const ingRows = (v.ingredients||[]).map((ing,idx) => {
    const dbItem = findInPantry(ing.name);
    if (!dbItem) return `<tr style="background:${idx%2===0?'#fff':'#f9f9f9'}">
      <td style="padding:6px 8px;font-size:11px;color:#C4501A;font-style:italic">${escHtml(ing.name)} ⚠ not in DB</td>
      <td colspan="5" style="padding:6px 8px;font-size:10px;color:#C4501A">Add to Ingredients Database to include in nutritional calculation</td>
    </tr>`;
    const unit = (ing.unit||'g').toLowerCase();
    let qty = ing.quantity;
    if (unit === 'kg') qty *= 1000;
    else if (unit === 'lt' || unit === 'l') qty *= 1000;
    const factor = qty / 100;
    const cal  = ((dbItem.cal ||0)*factor).toFixed(1);
    const prot = ((dbItem.prot||0)*factor).toFixed(1);
    const carb = ((dbItem.carb||0)*factor).toFixed(1);
    const fat  = ((dbItem.fat ||0)*factor).toFixed(1);
    return `<tr style="background:${idx%2===0?'#fff':'#f9f9f9'}">
      <td style="padding:6px 8px;font-size:11px;font-weight:700">${escHtml(ing.name)}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-family:monospace">${formatQty(ing.quantity,ing.unit||'g')}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-family:monospace;font-weight:700">${cal}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-family:monospace">${prot}g</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-family:monospace">${carb}g</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-family:monospace">${fat}g</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600;700;800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;color:#000;font-size:11px}
.page{width:210mm;padding:12mm;margin:0 auto}
.title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;margin-bottom:4px}
.nut-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.nut-card{border:1px solid #000;padding:12px;text-align:center}
.nut-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#C4501A}
.nut-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#333;margin-top:3px}
.nut-sub{font-size:10px;color:#555;font-weight:600;margin-top:2px}
.macro-bar{height:16px;display:flex;border-radius:2px;overflow:hidden;margin-bottom:6px}
table{width:100%;border-collapse:collapse;margin-bottom:12px}
thead tr{background:#111;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
th{padding:7px 8px;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:800;text-align:left;color:#fff !important}

@media print{*{color:#000 !important}thead tr{background:#111 !important}thead th{color:#fff !important}}
</style></head><body><div class="page">

<div style="border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:16px">
  <div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#C4501A;margin-bottom:4px">CHEFS LAB — NUTRITIONAL SUMMARY</div>
  <div class="title">${escHtml(r.title)}</div>
  <div style="font-size:11px;color:#333;font-weight:600">${cfg.label} · ${portions} portions · ${new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'})}</div>
</div>

<div style="margin-bottom:16px">
  <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#333;margin-bottom:8px">PER PORTION</div>
  <div class="nut-grid">
    <div class="nut-card"><div class="nut-val">${Math.round(perPortion.cal)}</div><div class="nut-lbl">Calories</div><div class="nut-sub">kcal</div></div>
    <div class="nut-card"><div class="nut-val">${perPortion.prot.toFixed(1)}g</div><div class="nut-lbl">Protein</div><div class="nut-sub">${Math.round(calFromProt/totalMacroCal*100)}% of cals</div></div>
    <div class="nut-card"><div class="nut-val">${perPortion.carb.toFixed(1)}g</div><div class="nut-lbl">Carbohydrates</div><div class="nut-sub">${Math.round(calFromCarb/totalMacroCal*100)}% of cals</div></div>
    <div class="nut-card"><div class="nut-val">${perPortion.fat.toFixed(1)}g</div><div class="nut-lbl">Total Fat</div><div class="nut-sub">${Math.round(calFromFat/totalMacroCal*100)}% of cals</div></div>
  </div>

  <div style="margin-bottom:12px">
    <div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Macronutrient Ratio (per portion)</div>
    <div class="macro-bar">
      <div style="width:${Math.round(calFromProt/totalMacroCal*100)}%;background:#2C7A4B;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800">P</div>
      <div style="width:${Math.round(calFromCarb/totalMacroCal*100)}%;background:#C4501A;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800">C</div>
      <div style="width:${Math.round(calFromFat/totalMacroCal*100)}%;background:#8B5E00;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800">F</div>
    </div>
    <div style="display:flex;gap:16px;font-size:9px;font-weight:600">
      <span style="color:#2C7A4B">■ Protein ${Math.round(calFromProt/totalMacroCal*100)}%</span>
      <span style="color:#C4501A">■ Carbs ${Math.round(calFromCarb/totalMacroCal*100)}%</span>
      <span style="color:#8B5E00">■ Fat ${Math.round(calFromFat/totalMacroCal*100)}%</span>
    </div>
  </div>
</div>

<table>
  <thead><tr>
    <th>Ingredient</th><th class="r">Qty Used</th>
    <th class="r">Calories</th><th class="r">Protein</th><th class="r">Carbs</th><th class="r">Fat</th>
  </tr></thead>
  <tbody>${ingRows}</tbody>
  <tfoot>
    <tr>
      <td colspan="2" style="text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px">TOTAL (whole recipe)</td>
      <td class="r">${Math.round(nut.totalCal)}</td>
      <td class="r">${nut.totalProt.toFixed(1)}g</td>
      <td class="r">${nut.totalCarb.toFixed(1)}g</td>
      <td class="r">${nut.totalFat.toFixed(1)}g</td>
    </tr>
    <tr>
      <td colspan="2" style="text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px">PER PORTION (÷${portions})</td>
      <td class="r" style="font-size:13px">${Math.round(perPortion.cal)}</td>
      <td class="r" style="font-size:13px">${perPortion.prot.toFixed(1)}g</td>
      <td class="r" style="font-size:13px">${perPortion.carb.toFixed(1)}g</td>
      <td class="r" style="font-size:13px">${perPortion.fat.toFixed(1)}g</td>
    </tr>
  </tfoot>
</table>

${nut.unmatched.length ? `<div style="font-size:10px;color:#C4501A;font-weight:700;margin-bottom:8px">⚠ Not included (not in database): ${nut.unmatched.join(', ')}</div>` : ''}
<div style="font-size:9px;color:#333;font-weight:600">Nutritional data sourced from Ingredients Database · Values are estimates · ${nut.matched} of ${(v.ingredients||[]).length} ingredients matched</div>
</div></body></html>`;

  openAndPrint(html, r.title + " — Nutritional Summary");
}

function togglePrintMenu() {
  const menu = document.getElementById("print-menu");
  if (!menu) return;
  menu.style.display = menu.style.display === "none" ? "block" : "none";
}

document.addEventListener("click", function(e) {
  const wrap = document.getElementById("print-menu-wrap");
  const menu = document.getElementById("print-menu");
  if (menu && wrap && !wrap.contains(e.target)) {
    menu.style.display = "none";
  }
});

function attachListeners() {
  const ep = document.getElementById("ai-prompt-editor");
  if (ep) ep.addEventListener("keydown", e => { if (e.key==="Enter"&&!e.shiftKey){e.preventDefault();aiRefine();} });
  drawDNA();
  drawPillarRadar();
  updateKeyStatus();
  updateMobileNav();
  if (state.activeView === 'pantry') setTimeout(renderDBTable, 100);
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Select all text on focus for all number/text inputs ────────────────
document.addEventListener('focusin', function(e) {
  if (e.target.tagName === 'INPUT' && (e.target.type === 'number' || e.target.type === 'text')) {
    e.target.select();
  }
